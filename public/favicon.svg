<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FFE5EC"/>
    </linearGradient>
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5C3A21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#favBg)"/>
  
  <!-- Badge Outer Ring -->
  <circle cx="256" cy="256" r="236" fill="#FFE5EC" stroke="#F4ACB7" stroke-width="8" filter="url(#favShadow)"/>
  <circle cx="256" cy="256" r="212" fill="#FFFFFF" stroke="#FF85A1" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Cupcake Illustration -->
  <g transform="translate(256, 175)">
    <ellipse cx="0" cy="50" rx="45" ry="8" fill="#F8BBD0" opacity="0.8"/>
    <!-- Liner -->
    <path d="M-32,10 L-22,48 C-22,50 -18,52 -12,52 L12,52 C18,52 22,50 22,48 L32,10 Z" fill="#F4ACB7" stroke="#D87093" stroke-width="3"/>
    <line x1="-18" y1="10" x2="-12" y2="50" stroke="#FFE5EC" stroke-width="3"/>
    <line x1="0" y1="10" x2="0" y2="50" stroke="#FFE5EC" stroke-width="3"/>
    <line x1="18" y1="10" x2="12" y2="50" stroke="#FFE5EC" stroke-width="3"/>
    <!-- Frosting -->
    <path d="M-42,10 C-48,10 -50,-2 -42,-12 C-36,-20 -22,-20 -16,-12 C-10,-24 8,-26 14,-18 C20,-26 36,-24 40,-12 C48,-20 56,-12 52,0 C58,10 48,14 42,10 Z" fill="#FFCAD4" stroke="#F4ACB7" stroke-width="3"/>
    <path d="M-30,-12 C-30,-26 -10,-42 0,-44 C10,-42 30,-26 30,-12 C20,-20 10,-22 0,-18 C-10,-22 -20,-20 -30,-12 Z" fill="#FFE5EC"/>
    <circle cx="-16" cy="-16" r="3" fill="#FF85A1"/>
    <circle cx="16" cy="-16" r="3" fill="#FF85A1"/>
    <circle cx="0" cy="-28" r="3" fill="#FF85A1"/>
    <!-- Cherry -->
    <path d="M0,-52 Q12,-70 24,-74" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-52" r="13" fill="#E53935" stroke="#B71C1C" stroke-width="1.5"/>
    <circle cx="-4" cy="-55" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="256" y="295" text-anchor="middle" fill="#5C3A21" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" letter-spacing="2">O DOCE MUNDO</text>
  <text x="256" y="348" text-anchor="middle" fill="#E85D75" font-family="'Playfair Display', serif" font-size="46" font-weight="700">da Lavínia</text>

  <!-- Ribbon -->
  <rect x="136" y="380" width="240" height="34" rx="17" fill="#FFCAD4" stroke="#F4ACB7" stroke-width="2"/>
  <text x="256" y="403" text-anchor="middle" fill="#4A2E2B" font-family="'Dancing Script', cursive" font-size="18" font-weight="700">Confeitaria Artesanal</text>
</svg>
